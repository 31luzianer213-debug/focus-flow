<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carregando…</title>
  <script>
    (function () {
      try {
        var route = location.pathname + location.search + location.hash;
        sessionStorage.setItem("brecho:route-redirect", route);
      } catch (e) {}
      location.replace("/");
    })();
  </script>
</head>
<body></body>
</html>
